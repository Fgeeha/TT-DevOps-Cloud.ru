apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: echo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
        - name: echo-server
          image: docker.io/fgeeha/echo-server:latest
          ports:
            - containerPort: 8000
          env:
            - name: AUTHOR
              value: "Nikita Kolesnikov"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
